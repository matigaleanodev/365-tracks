name: Validate

# Validación sin credenciales. La publicación vive en deploy.yml.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NG_CLI_ANALYTICS: 'false'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Versión del release
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version=$(jq -r .version package.json)
          [[ "$HEAD_REF" == "release/$version" ]] ||
            { echo "package.json tiene $version: debe coincidir con $HEAD_REF."; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # El build productivo usa los valores públicos versionados en deploy/production.json.
      - run: npm run build
      - name: Distribución sin fixtures ni secretos
        run: npm run verify:dist
      - name: Configuración de Workers
        run: npx wrangler deploy --dry-run
      - name: Preview local con Wrangler
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 30); do
            curl -fs -o /dev/null http://127.0.0.1:8787/ && break
            sleep 1
          done
          npm run verify:site || { cat "$RUNNER_TEMP/wrangler.log"; exit 1; }
