<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    svg {
      --brand-record: #242326;
      --brand-groove: #49474c;
      --brand-label: #8b79c6;
    }
    .record {
      fill: var(--brand-record);
    }
    .groove {
      fill: none;
      stroke: var(--brand-groove);
    }
    .label {
      fill: var(--brand-label);
    }
    .edge {
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --brand-record: #39373f;
        --brand-groove: #605d67;
        --brand-label: #b5a6e8;
      }
      .edge-32 {
        display: inline;
      }
    }
    @media (max-width: 24px) {
      .groove-32,
      .edge-32 {
        display: none;
      }
    }
    @media (max-width: 24px) and (prefers-color-scheme: dark) {
      .edge-16 {
        display: inline;
      }
    }
  </style>
  <circle class="record" cx="16" cy="16" r="16" />
  <circle class="groove groove-32" cx="16" cy="16" r="12.5" stroke-width="1" />
  <circle class="groove groove-32" cx="16" cy="16" r="9.75" stroke-width="1" />
  <circle class="groove edge edge-32" cx="16" cy="16" r="15.5" stroke-width="1" />
  <circle class="groove edge edge-16" cx="16" cy="16" r="15" stroke-width="2" />
  <circle class="label" cx="16" cy="16" r="6.5" />
  <circle class="record" cx="16" cy="16" r="2" />
</svg>
